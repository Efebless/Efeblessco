<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EFEBLESSCO — Multi-Skilled Professional</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#1c2024;
    --paper:#f6f3ec;
    --panel:#171b1f;
    --panel-2:#20262c;
    --brass:#c48a3a;
    --brass-light:#e0ab5c;
    --line: rgba(246,243,236,0.14);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
  }

  .wrap{
    min-height:100vh;
    display:flex;
    flex-wrap:wrap;
  }

  .id-panel{
    background:var(--panel);
    color:var(--paper);
    flex:1 1 380px;
    max-width:420px;
    padding:48px 40px;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  .id-panel::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(90deg, transparent, transparent 39px, var(--line) 40px),
      repeating-linear-gradient(0deg, transparent, transparent 39px, var(--line) 40px);
    opacity:0.4;
    pointer-events:none;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--brass-light);
    z-index:1;
  }

  .photo-slot{
    margin-top:28px;
    width:100%;
    aspect-ratio: 3 / 4;
    background: linear-gradient(155deg, #2a3138, #14171a 70%);
    border-radius:6px;
    position:relative;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.65),
      0 10px 25px -8px rgba(0,0,0,0.55),
      inset 0 0 0 1px rgba(246,243,236,0.08);
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .photo-slot::after{
    content:"PHOTO";
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.2em;
    color:rgba(246,243,236,0.28);
  }

  .photo-slot img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:6px;
    position:absolute;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="id-panel">
      <div class="eyebrow">EFEBLESSCO Services</div>
      <div class="photo-slot">
        <!-- Add your photo here like: <img src="your-photo.jpg" alt="Profile"> -->
      </div>
    </div>
  </div>

  <!-- EXIT-INTENT POP-UP -->
  <dialog id="exitPopup" style="border: none; border-radius: 12px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 320px; text-align: center;">
    <h3 style="margin-top: 0; color: #333;">🛑 Wait, don't go yet!</h3>
    <p style="color: #666; margin: 15px 0;">Book your service today and get <strong>10% off</strong> your first visit! 🛠️⚡</p>
    
    <!-- WHATSAPP DIRECT LINK WITH YOUR NUMBER -->
    <a href="https://wa.me/2349013440139?text=Hello%20EFEBLESSCO,%20I%20would%20like%20to%20claim%20my%2010%25%20discount%20booking!" target="_blank" style="display: inline-block; background: #25D366; color: white; padding: 12px 22px; border-radius: 6px; text-decoration: none; font-size: 16px; font-weight: bold; box-shadow: 0 4px 10px rgba(37,211,102,0.3);">💬 Chat on WhatsApp</a>
  </dialog>

  <!-- POP-UP LOGIC & 7-SECOND TIMER -->
  <script>
    document.addEventListener("mouseleave", function(event) {
      const popup = document.getElementById("exitPopup");
      if (!popup.open) {
        popup.showModal();
        
        // Auto-close after 7 seconds
        setTimeout(function() {
          popup.close();
        }, 7000);
      }
    });
  </script>

</body>
</html>
